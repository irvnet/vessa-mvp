[project]
name = "vessa"
version = "0.1.0"
description = "Vessa — an AI companion app for elderly care"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app"]
exclude = ["data*", "scripts*", "ami*", "provision*"]
