name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      # No OPENAI_API_KEY secret: these tests only cover the deterministic paths
      # (time grounding, regex input rails) and never make a network call.
      # tests/conftest.py supplies a placeholder so module-level clients construct.
      - name: Run tests
        run: uv run pytest -q
